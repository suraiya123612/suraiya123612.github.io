.dark-mode {
        background-color: #121212;
        color: #e0e0e0;

        background-color: black;
    }

    .dark-mode nav ul li a {
        color: black;
    }

        background-color: #333;
        color: #fff;

    }

    .dark-mode .bt {
        background-color: #444;
    }
    .dark-mode .contact{background-color: #121212;}
    .dark-mode input{ background-color:darkgray; }
.dark-mode textarea{ background-color:darkgray; }

	background-color: #121212;
	color: wheat;
}
.dark-mode .footer-section ul li a{
	color: black;
}

	background-color: #121212;

<h2>Contact Us</h2>
<form>
	<input type="text" name="name" placeholder="Your Name" required/>
	<input type="email" name="email" placeholder="Your Email" required/>
	<textarea name="message" rows="5" placeholder="Your Message" required/></textarea>
	<button type="submit" class="butt">Send Message</button>
	
</form></div>
<script>
	const toggleButton = document.getElementById('toggle');

if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
    if (toggleButton) toggleButton.textContent = 'LIGHT MODE';
} else {
    if (toggleButton) toggleButton.textContent = 'DARK MODE';
}

if (toggleButton) {
    toggleButton.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');

        if (document.body.classList.contains('dark-mode')) {
            toggleButton.textContent = 'LIGHT MODE';
            localStorage.setItem('theme', 'dark');
        } else {
            toggleButton.textContent = 'DARK MODE';
            localStorage.setItem('theme', 'light');
        }
    });
}

</script>
